name: manifest-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Validate manifests
        run: python3 scripts/validate-manifests.py

      - name: Install Claude Code CLI 2.1.308
        run: npm install --prefix /tmp/claude-cli @anthropic-ai/claude-code@2.1.308 --no-fund --no-audit

      - name: Claude plugin validate
        run: /tmp/claude-cli/node_modules/.bin/claude plugin validate . --strict --profile directory

      - name: Build OpenAI plugin zip
        run: python3 scripts/build-openai-plugin-zip.py

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Secret scan
        run: /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
